[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvasir-robust-segmentation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "torchvision>=0.17", "segmentation-models-pytorch>=0.3.3",
  "albumentations>=1.4", "opencv-python-headless>=4.9", "numpy>=1.24",
  "pandas>=2.0", "scikit-learn>=1.3", "PyYAML>=6.0", "Pillow>=10"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
