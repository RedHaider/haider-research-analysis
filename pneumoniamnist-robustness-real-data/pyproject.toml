[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumoniamnist-robustness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "torchvision", "scikit-learn", "medmnist", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]

